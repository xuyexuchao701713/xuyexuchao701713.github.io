    <title>钢琴练习打卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root{--safe:env(safe-area-inset-bottom,16px)}
        *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none}
        .tab-bar{padding-bottom:var(--safe)}
        .tab-item.active{color:#8b5e3c}
        .tab-item.active .dot{opacity:1}
        .dot{opacity:0}
        .card{transition:all .2s}
        .card:active{transform:scale(.98)}
        .page{display:none}
        .page.active{display:block}
        .tag{background:#fef3c7;color:#92400e;font-size:11px;padding:2px 8px;border-radius:6px}
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<header class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shrink-0 sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-sm font-bold" style="background:#8b5e3c">琴</div>
        <div><h1 class="text-base font-bold text-gray-800">钢琴练习打卡</h1><p class="text-xs text-gray-400" id="today-date"></p></div>
    </div>
</header>

<main class="flex-1 overflow-y-auto pb-24" id="main-content">

<!-- ====== 打卡页 ====== -->
<div id="page-checkin" class="page active p-4">

    <!-- 今日统计 -->
    <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
            <p class="text-xs text-gray-500">今日练习</p>
            <p class="text-xl font-bold mt-1" style="color:#8b5e3c" id="today-minutes">0<span class="text-sm font-normal text-gray-400">分钟</span></p>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
            <p class="text-xs text-gray-500">本周累计</p>
            <p class="text-xl font-bold mt-1" style="color:#8b5e3c" id="week-minutes">0<span class="text-sm font-normal text-gray-400">分钟</span></p>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
            <p class="text-xs text-gray-500">连续打卡</p>
            <p class="text-xl font-bold mt-1" style="color:#8b5e3c" id="streak-days">0<span class="text-sm font-normal text-gray-400">天</span></p>
        </div>
    </div>

    <!-- 练习记录输入 -->
    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-3">
        <h3 class="font-bold text-gray-800 text-sm mb-3">🎹 今日练习记录</h3>
        <input id="piece-input" placeholder="弹了什么曲子？" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm mb-3">
        <div class="flex gap-3 mb-3">
            <input id="minutes-input" type="number" placeholder="练习时长(分钟)" class="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 text-sm" min="1" max="180">
            <select id="quality-select" class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-600">
                <option value="good">👍 很好</option>
                <option value="normal">👌 一般</option>
                <option value="needwork">💪 需加强</option>
            </select>
        </div>
        <textarea id="note-input" placeholder="备注：弹得怎么样？遇到什么问题？" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm resize-none h-16 mb-3"></textarea>
        <button onclick="submitPractice()" class="w-full py-3 rounded-xl text-white font-medium text-sm active:opacity-80" style="background:#8b5e3c">✅ 提交打卡</button>
    </div>

    <!-- 拍照/视频 -->
    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-3">
        <h3 class="font-bold text-gray-800 text-sm mb-3">📸 记录瞬间</h3>
        <div class="flex gap-3">
            <button onclick="document.getElementById('photo-input').click()" class="flex-1 py-3 rounded-xl border border-gray-200 text-sm text-gray-600 active:bg-gray-50 text-center">📷 拍照</button>
            <button onclick="document.getElementById('video-input').click()" class="flex-1 py-3 rounded-xl border border-gray-200 text-sm text-gray-600 active:bg-gray-50 text-center">🎥 录视频</button>
        </div>
        <input type="file" accept="image/*" capture="environment" id="photo-input" onchange="previewMedia(event,'photo')" class="hidden">
        <input type="file" accept="video/*" capture="environment" id="video-input" onchange="previewMedia(event,'video')" class="hidden">
        <div id="media-preview" class="mt-3 hidden">
            <img id="photo-preview" class="w-full rounded-xl max-h-48 object-cover hidden">
            <video id="video-preview" class="w-full rounded-xl max-h-48 hidden" controls></video>
            <button onclick="clearMedia()" class="mt-2 text-xs text-red-400">清除</button>
        </div>
    </div>

    <!-- 今日已完成 -->
    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm">
        <h3 class="font-bold text-gray-800 text-sm mb-3">✅ 今日已完成</h3>
        <div id="today-list" class="space-y-2"></div>
    </div>
</div>

<!-- ====== 历史记录 ====== -->
<div id="page-history" class="page p-4">
    <h2 class="text-lg font-bold text-gray-800 mb-3">📋 练习历史</h2>
    <div id="history-list" class="space-y-2"></div>
</div>

<!-- ====== 分享给老师 ====== -->
<div id="page-share" class="page p-4">
    <h2 class="text-lg font-bold text-gray-800 mb-3">🔗 分享给老师</h2>
    <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-4">
        <h3 class="font-bold text-gray-800 text-sm mb-3">选择分享范围</h3>
        <div class="space-y-2">
            <label class="flex items-center gap-3 p-3 border border-gray-100 rounded-xl active:bg-gray-50">
                <input type="radio" name="share-range" value="today" checked class="accent-amber-600"><span class="text-sm">今日练习</span>
            </label>
            <label class="flex items-center gap-3 p-3 border border-gray-100 rounded-xl active:bg-gray-50">
                <input type="radio" name="share-range" value="week"><span class="text-sm">本周练习汇总</span>
            </label>
        </div>
    </div>
    <button onclick="generateShare()" class="w-full py-3 rounded-xl text-white font-medium text-sm active:opacity-80 mb-3" style="background:#8b5e3c">📤 生成分享卡片</button>
    <div id="share-preview" class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm hidden"></div>
    <button id="share-btn" onclick="shareToWechat()" class="w-full py-3 rounded-xl text-white font-medium text-sm active:opacity-80 hidden" style="background:#07c160">💬 分享到微信</button>
</div>

</main>

        </button>

</nav>

<script>
const STORAGE = {
    practices: 'piano_practices',
    todayMedia: 'piano_today_media',
    streak: 'piano_streak',
    lastDate: 'piano_last_date'
};

function get(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){return null;} }
function set(k,v){ localStorage.setItem(k,JSON.stringify(v)); }

let todayMedia = get(STORAGE.todayMedia) || null;

// ===== 日期 =====
const today = new Date();
document.getElementById('today-date').textContent = today.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'});

// ===== 提交打卡 =====
function submitPractice() {
    const piece = document.getElementById('piece-input').value.trim();
    const minutes = parseInt(document.getElementById('minutes-input').value) || 0;
    const quality = document.getElementById('quality-select').value;
    const note = document.getElementById('note-input').value.trim();

    if(!piece) { alert('请输入曲目名称'); return; }
    if(minutes <= 0) { alert('请输入练习时长'); return; }

    const practices = get(STORAGE.practices) || [];
    const todayStr = today.toISOString().split('T')[0];

    // Check if already submitted today
    const existing = practices.findIndex(p => p.date === todayStr);
    
    const record = {
        date: todayStr,
        time: today.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'}),
        piece: piece,
        minutes: minutes,
        quality: quality,
        note: note,
        media: todayMedia
    };

    if(existing >= 0) {
        practices[existing] = record;
    } else {
        practices.push(record);
    }

    set(STORAGE.practices, practices);
    todayMedia = null;
    set(STORAGE.todayMedia, null);
    
    // Clear inputs
    document.getElementById('piece-input').value = '';
    document.getElementById('minutes-input').value = '';
    document.getElementById('note-input').value = '';
    clearMedia();
    
    updateStats();
    renderToday();
    alert('打卡成功！🎉');
}

// ===== 拍照/视频 =====
function previewMedia(event, type) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        todayMedia = { type: type, data: e.target.result };
        set(STORAGE.todayMedia, todayMedia);
        document.getElementById('media-preview').classList.remove('hidden');
        if(type === 'photo') {
            document.getElementById('photo-preview').src = e.target.result;
            document.getElementById('photo-preview').classList.remove('hidden');
            document.getElementById('video-preview').classList.add('hidden');
        } else {
            document.getElementById('video-preview').src = e.target.result;
            document.getElementById('video-preview').classList.remove('hidden');
            document.getElementById('photo-preview').classList.add('hidden');
        }
    };
    reader.readAsDataURL(file);
}

function clearMedia() {
    todayMedia = null;
    set(STORAGE.todayMedia, null);
    document.getElementById('media-preview').classList.add('hidden');
    document.getElementById('photo-preview').classList.add('hidden');
    document.getElementById('video-preview').classList.add('hidden');
    document.getElementById('photo-input').value = '';
    document.getElementById('video-input').value = '';
}

// ===== 渲染今日 =====
function renderToday() {
    const practices = get(STORAGE.practices) || [];
    const todayStr = today.toISOString().split('T')[0];
    const todayRecords = practices.filter(p => p.date === todayStr);
    
    const container = document.getElementById('today-list');
    if(todayRecords.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">今天还没打卡，快开始练琴吧 🎹</p>';
        return;
    }
    
    container.innerHTML = todayRecords.map(r => {
        const qEmoji = r.quality === 'good' ? '👍' : r.quality === 'normal' ? '👌' : '💪';
        const qLabel = r.quality === 'good' ? '很好' : r.quality === 'normal' ? '一般' : '需加强';
        return '<div class="p-3 rounded-xl border border-gray-100">'+
            '<div class="flex justify-between items-start mb-1">'+
                '<span class="font-bold text-gray-800 text-sm">🎵 '+r.piece+'</span>'+
                '<span class="tag">'+qEmoji+' '+qLabel+'</span>'+
            '</div>'+
            '<div class="flex gap-3 text-xs text-gray-500">'+
                '<span>⏱ '+r.minutes+'分钟</span>'+
                '<span>🕐 '+r.time+'</span>'+
            '</div>'+
            (r.note ? '<p class="text-xs text-gray-500 mt-1">💬 '+r.note+'</p>' : '')+
            (r.media ? '<div class="mt-2">'+(r.media.type==='photo'?'<img src="'+r.media.data+'" class="w-full rounded-lg max-h-32 object-cover">':'<video src="'+r.media.data+'" class="w-full rounded-lg max-h-32" controls></video>')+'</div>' : '')+
        '</div>';
    }).join('');
}

// ===== 渲染历史 =====
function renderHistory() {
    const practices = get(STORAGE.practices) || [];
    practices.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    const container = document.getElementById('history-list');
    if(practices.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">暂无记录</p>';
        return;
    }

    // Group by date
    const grouped = {};
    practices.forEach(p => {
        if(!grouped[p.date]) grouped[p.date] = [];
        grouped[p.date].push(p);
    });

    container.innerHTML = Object.entries(grouped).map(([date, records]) => {
        const totalMin = records.reduce((s,r) => s+r.minutes, 0);
        const d = new Date(date);
        const dayLabel = d.toLocaleDateString('zh-CN', {month:'numeric',day:'numeric',weekday:'short'});
        return '<div class="mb-3">'+
            '<div class="flex justify-between items-center mb-2 px-1">'+
                '<span class="text-sm font-bold text-gray-700">📅 '+dayLabel+'</span>'+
                '<span class="text-xs text-gray-500">共 '+totalMin+' 分钟</span>'+
            '</div>'+
            records.map(r => {
                const qEmoji = r.quality === 'good' ? '👍' : r.quality === 'normal' ? '👌' : '💪';
                return '<div class="p-3 rounded-xl border border-gray-100 bg-white mb-1.5">'+
                    '<div class="flex justify-between items-start">'+
                        '<span class="font-medium text-gray-800 text-sm">🎵 '+r.piece+'</span>'+
                        '<span class="text-xs text-gray-500">'+r.minutes+'分钟 '+qEmoji+'</span>'+
                    '</div>'+
                    (r.note ? '<p class="text-xs text-gray-500 mt-1">'+r.note+'</p>' : '')+
                    (r.media ? '<div class="mt-2">'+(r.media.type==='photo'?'<img src="'+r.media.data+'" class="w-full rounded-lg max-h-32 object-cover" onclick="viewFullImage(this.src)">':'<video src="'+r.media.data+'" class="w-full rounded-lg max-h-32" controls></video>')+'</div>' : '')+
                '</div>';
            }).join('')+
        '</div>';
    }).join('');
}

// ===== 统计 =====
function updateStats() {
    const practices = get(STORAGE.practices) || [];
    const todayStr = today.toISOString().split('T')[0];
    
    // Today
    const todayMin = practices.filter(p => p.date === todayStr).reduce((s,r) => s+r.minutes, 0);
    document.getElementById('today-minutes').innerHTML = todayMin+'<span class="text-sm font-normal text-gray-400">分钟</span>';
    
    // This week
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() - today.getDay());
    const weekMin = practices.filter(p => new Date(p.date) >= weekStart).reduce((s,r) => s+r.minutes, 0);
    document.getElementById('week-minutes').innerHTML = weekMin+'<span class="text-sm font-normal text-gray-400">分钟</span>';
    
    // Streak
    let streak = get(STORAGE.streak) || 0;
    const lastDate = get(STORAGE.lastDate);
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate()-1);
    const yesterdayStr = yesterday.toISOString().split('T')[0];
    
    if(todayMin > 0) {
        if(lastDate === yesterdayStr) streak++;
        else if(lastDate !== todayStr) streak = 1;
        set(STORAGE.lastDate, todayStr);
        set(STORAGE.streak, streak);
    } else if(lastDate !== yesterdayStr && lastDate !== todayStr) {
        streak = 0;
        set(STORAGE.streak, 0);
    }
    
    document.getElementById('streak-days').innerHTML = streak+'<span class="text-sm font-normal text-gray-400">天</span>';
}

// ===== 分享 =====
let currentShareImageData = null;

function generateShare() {
    const practices = get(STORAGE.practices) || [];
    const range = document.querySelector('input[name="share-range"]:checked').value;
    const todayStr = today.toISOString().split('T')[0];
    
    let records;
    let title;
    if(range === 'today') {
        records = practices.filter(p => p.date === todayStr);
        title = '今日钢琴练习';
    } else {
        const weekStart = new Date(today);
        weekStart.setDate(today.getDate() - today.getDay());
        records = practices.filter(p => new Date(p.date) >= weekStart);
        title = '本周钢琴练习汇总';
    }
    
    if(records.length === 0) {
        alert('该范围内暂无练习记录');
        return;
    }
    
    const totalMin = records.reduce((s,r) => s+r.minutes, 0);
    const pieces = records.map(r => '🎵 '+r.piece+' ('+r.minutes+'分钟)').join('\n');
    const dateStr = today.toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric'});
    
    // Check if any record has media, use first one found
    const mediaRecord = records.find(r => r.media && r.media.type === 'photo');
    
    const preview = document.getElementById('share-preview');
    preview.classList.remove('hidden');
    
    let mediaHtml = '';
    if(mediaRecord) {
        mediaHtml = '<img src="'+mediaRecord.media.data+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:12px" id="share-card-image">';
    }
    
    preview.innerHTML = '<div id="share-card" style="background:linear-gradient(135deg,#8b5e3c,#6b3a1f);color:#fff;padding:20px;border-radius:16px;text-align:center">'+
        '<p style="font-size:28px;margin-bottom:4px">🎹</p>'+
        '<h3 style="font-size:18px;font-weight:bold;margin-bottom:4px">'+title+'</h3>'+
        '<p style="font-size:12px;opacity:0.8;margin-bottom:12px">玛雅辛巴星艺术培训学校 · '+dateStr+'</p>'+
        '<div style="background:rgba(255,255,255,0.15);border-radius:12px;padding:12px;margin-bottom:12px">'+
            '<p style="font-size:32px;font-weight:bold">'+totalMin+'<span style="font-size:14px">分钟</span></p>'+
            '<p style="font-size:12px;opacity:0.8">练习时长</p>'+
        '</div>'+
        '<div style="text-align:left;font-size:13px;line-height:1.8">'+
            pieces.replace(/\n/g,'<br>')+
        '</div>'+
        '<p style="font-size:11px;opacity:0.6;margin-top:12px">坚持就是胜利，每一天都在进步！💪</p>'+
    '</div>';
    
    // Also show practice photos below the card
    const allPhotos = records.filter(r => r.media && r.media.type === 'photo');
    if(allPhotos.length > 0 && !mediaRecord) {
        // Show photos separately if not already in card
    }
    
    document.getElementById('share-btn').classList.remove('hidden');
    
    // Save share text
    window._shareText = title+'\n练习时长：'+totalMin+'分钟\n'+pieces.replace(/\n/g,'\n')+'\n\n坚持就是胜利！💪';
    window._shareRecords = records;
    window._shareTitle = title;
    window._shareTotalMin = totalMin;
    
    // Generate share card as image using canvas
    generateShareImage(title, records, totalMin, dateStr);
}

function generateShareImage(title, records, totalMin, dateStr) {
    // Build share card as image via canvas
    const pieces = records.map(r => '🎵 '+r.piece+' ('+r.minutes+'分钟)').join('\n');
    const mediaRecord = records.find(r => r.media && r.media.type === 'photo');
    
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const width = 750;
    const padding = 40;
    const lineHeight = 36;
    const textLines = pieces.split('\n');
    const extraHeight = textLines.length * lineHeight;
    let height = 380 + extraHeight;
    
    canvas.width = width;
    canvas.height = height;
    
    // Background gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, '#8b5e3c');
    gradient.addColorStop(1, '#6b3a1f');
    ctx.fillStyle = gradient;
    roundRect(ctx, 0, 0, width, height, 24);
    ctx.fill();
    
    let y = 50;
    
    // Title
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎹', width/2, y);
    y += 36;
    ctx.font = 'bold 36px -apple-system, sans-serif';
    ctx.fillText(title, width/2, y);
    y += 30;
    ctx.font = '20px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('玛雅辛巴星艺术培训学校 · '+dateStr, width/2, y);
    y += 40;
    
    // Total minutes badge
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    roundRect(ctx, width/2-140, y-10, 280, 80, 16);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(totalMin+'', width/2-20, y+40);
    ctx.font = '20px -apple-system, sans-serif';
    ctx.fillText('分钟', width/2+40, y+40);
    ctx.font = '18px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('练习时长', width/2, y+60);
    y += 95;
    
    // Pieces list
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '24px -apple-system, sans-serif';
    textLines.forEach(line => {
        ctx.fillText(line, padding+10, y);
        y += lineHeight;
    });
    
    y += 20;
    
    // Footer
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '18px -apple-system, sans-serif';
    ctx.fillText('坚持就是胜利，每一天都在进步！💪', width/2, y);
    
    currentShareImageData = canvas.toDataURL('image/png');
    
    // Update preview to show the generated image
    const preview = document.getElementById('share-preview');
    preview.innerHTML = '<img src="'+currentShareImageData+'" style="width:100%;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.15)" id="share-card-img">'+
        '<p style="font-size:12px;color:#999;text-align:center;margin-top:8px">👆 点击下方按钮分享这张卡片给老师</p>';
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
}

function shareToWechat() {
    if(!window._shareText) return;
    
    // Try Web Share API with image file
    if(navigator.share && currentShareImageData) {
        // Convert base64 to blob
        const byteString = atob(currentShareImageData.split(',')[1]);
        const mimeString = currentShareImageData.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for(let i=0; i<byteString.length; i++) ia[i] = byteString.charCodeAt(i);
        const blob = new Blob([ab], {type: mimeString});
        const file = new File([blob], 'piano-practice.png', {type: mimeString});
        
        navigator.share({
            title: window._shareTitle,
            text: window._shareText,
            files: [file]
        }).catch(() => {
            // Fallback if files not supported
            fallbackShare();
        });
    } else if(navigator.share) {
        navigator.share({ title: '钢琴练习打卡', text: window._shareText }).catch(() => {
            fallbackShare();
        });
    } else {
        fallbackShare();
    }
}

function fallbackShare() {
    // Save image and copy text
    if(currentShareImageData) {
        // Create a download link for the image
        const a = document.createElement('a');
        a.href = currentShareImageData;
        a.download = '钢琴练习打卡.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        // Also copy text
        const ta = document.createElement('textarea');
        ta.value = window._shareText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('✅ 分享卡片图片已保存到相册\n📋 文字已复制到剪贴板\n\n打开微信 → 发送图片 → 粘贴文字，一起发给老师即可！');
    } else {
        const ta = document.createElement('textarea');
        ta.value = window._shareText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('已复制到剪贴板，打开微信粘贴发送给老师即可');
    }
}

// ===== Tab切换 =====
function switchPage(id) {
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-item[data-page="'+id+'"]').forEach(el => el.classList.add('active'));
    if(id === 'history') renderHistory();
    if(id === 'share') generateShare();
    document.getElementById('main-content').scrollTop = 0;
}

document.querySelectorAll('.tab-item').forEach(btn => {
    btn.addEventListener('click', () => switchPage(btn.dataset.page));
});

// ===== 初始化 =====
const savedMedia = get(STORAGE.todayMedia);
if(savedMedia) {
    todayMedia = savedMedia;
    document.getElementById('media-preview').classList.remove('hidden');
    if(savedMedia.type === 'photo') {
        document.getElementById('photo-preview').src = savedMedia.data;
        document.getElementById('photo-preview').classList.remove('hidden');
    } else {
        document.getElementById('video-preview').src = savedMedia.data;
        document.getElementById('video-preview').classList.remove('hidden');
    }
}

// ===== 图片放大查看 =====
function viewFullImage(src) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer';
    overlay.innerHTML = '<img src="'+src+'" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px">';
    overlay.addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
}

updateStats();
renderToday();
</script>
