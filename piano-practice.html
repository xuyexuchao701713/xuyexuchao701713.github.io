<body class="min-h-screen flex flex-col">

<main class="flex-1 overflow-y-auto pb-20" id="main-content">

            <div class="text-center"><p class="text-2xl font-bold text-purple-600" id="today-total">0</p><p class="text-xs text-gray-400">今日分钟</p></div>
            <div class="text-center"><p class="text-2xl font-bold text-purple-600" id="pieces-count">0</p><p class="text-xs text-gray-400">练习曲目</p></div>

    </div>

        <p class="text-xs text-gray-400 mb-4" id="timer-status">点击开始记录练琴时间</p>
        <div class="flex gap-3 justify-center">
            <button id="timer-start-btn" onclick="startTimer()" class="px-8 py-3 rounded-full text-white font-medium text-sm active:opacity-80 transition-all" style="background:linear-gradient(135deg,#7c3aed,#a855f7)">▶ 开始计时</button>
            <button id="timer-pause-btn" onclick="pauseTimer()" class="px-8 py-3 rounded-full bg-gray-100 text-gray-600 font-medium text-sm active:bg-gray-200 hidden">⏸ 暂停</button>
            <button id="timer-stop-btn" onclick="stopTimer()" class="px-8 py-3 rounded-full bg-red-50 text-red-500 font-medium text-sm active:bg-red-100 hidden">⏹ 结束</button>

    </div>

    <!-- 添加曲目 -->

<script>
// ===== Storage =====
const S = {
    pieces: 'pp_pieces_v2',
    sessions: 'pp_sessions_v2',
    photos: 'pp_photos_v2',
    streak: 'pp_streak_v2',
    lastDate: 'pp_lastdate_v2'
};
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('存储空间不足');return false}}

// ===== Timer =====
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;
let timerStartTime = null;

function updateTimerDisplay() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('timer-display').textContent = String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function startTimer() {
    if(timerRunning) return;
    timerRunning = true;
    timerStartTime = new Date();
    document.getElementById('timer-start-btn').classList.add('hidden');
    document.getElementById('timer-pause-btn').classList.remove('hidden');
    document.getElementById('timer-stop-btn').classList.remove('hidden');
    document.getElementById('timer-status').textContent = '正在记录练习时间...';
    timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
    }, 1000);
}

function pauseTimer() {
    if(!timerRunning) return;
    timerRunning = false;
    clearInterval(timerInterval);
    document.getElementById('timer-start-btn').classList.remove('hidden');
    document.getElementById('timer-start-btn').textContent = '▶ 继续计时';
    document.getElementById('timer-pause-btn').classList.add('hidden');
    document.getElementById('timer-status').textContent = '已暂停';
}

function stopTimer() {
    if(timerSeconds < 60) {
        if(!confirm('练习时间不足1分钟，确定结束吗？')) return;
    }
    timerRunning = false;
    clearInterval(timerInterval);
    
    const minutes = Math.max(1, Math.round(timerSeconds / 60));
    const sessions = get(S.sessions) || [];
    sessions.push({
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),
        minutes: minutes,
        pieces: (get(S.pieces)||[]).filter(p=>!p.done).map(p=>p.name)
    });
    set(S.sessions, sessions);
    
    // Mark all pieces as done
    const pieces = get(S.pieces) || [];
    pieces.forEach(p => p.done = true);
    set(S.pieces, pieces);
    
    // Save photos with session
    const photos = get(S.photos) || [];
    if(photos.length > 0) {
        const lastSession = sessions[sessions.length-1];
        lastSession.photos = [...photos];
        set(S.photos, []);
        set(S.sessions, sessions);
    }
    
    // Reset timer
    timerSeconds = 0;
    updateTimerDisplay();
    document.getElementById('timer-start-btn').classList.remove('hidden');
    document.getElementById('timer-start-btn').textContent = '▶ 开始计时';
    document.getElementById('timer-pause-btn').classList.add('hidden');
    document.getElementById('timer-stop-btn').classList.add('hidden');
    document.getElementById('timer-status').textContent = '点击开始记录练琴时间';
    
    updateAll();
    alert('✅ 练习记录已保存！共 '+minutes+' 分钟');
}

// ===== Pieces =====
function addPiece() {
    const input = document.getElementById('new-piece-input');
    const name = input.value.trim();
    if(!name) return;
    const pieces = get(S.pieces) || [];
    pieces.push({name, done: false, addedAt: new Date().toISOString()});
    set(S.pieces, pieces);
    input.value = '';
    renderPieces();
}

function togglePiece(index) {
    const pieces = get(S.pieces) || [];
    pieces[index].done = !pieces[index].done;
    set(S.pieces, pieces);
    renderPieces();
}

function removePiece(index) {
    const pieces = get(S.pieces) || [];
    pieces.splice(index, 1);
    set(S.pieces, pieces);
    renderPieces();
}

function renderPieces() {
    const pieces = get(S.pieces) || [];
    const container = document.getElementById('pieces-list');
    if(pieces.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">还没有添加曲目，添加后开始练琴吧 🎵</p>';
    } else {
        container.innerHTML = pieces.map((p,i) => 
            '<div class="piece-item bg-white rounded-xl p-3 border border-purple-100 shadow-sm flex items-center gap-3 fade-in">'+
                '<button onclick="togglePiece('+i+')" class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 '+(p.done?'bg-purple-500 border-purple-500':'border-gray-300')+'">'+
                    (p.done?'<span class="text-white text-xs">✓</span>':'')+
                '</button>'+
                '<span class="flex-1 text-sm '+(p.done?'line-through text-gray-400':'text-gray-700')+'">'+p.name+'</span>'+
                '<button onclick="removePiece('+i+')" class="text-gray-300 text-xs">✕</button>'+
            '</div>'
        ).join('');
    }
    document.getElementById('pieces-count').textContent = pieces.length;
}

// ===== Photos =====
function addPracticePhoto(event) {
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        // Compress
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const ratio = Math.min(1, 600/img.width);
            canvas.width = img.width*ratio;
            canvas.height = img.height*ratio;
            canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
            const compressed = canvas.toDataURL('image/jpeg',0.5);
            
            const photos = get(S.photos) || [];
            photos.push(compressed);
            set(S.photos, photos);
            renderPhotos();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function removePhoto(index) {
    const photos = get(S.photos) || [];
    photos.splice(index,1);
    set(S.photos, photos);
    renderPhotos();
}

function renderPhotos() {
    const photos = get(S.photos) || [];
    const container = document.getElementById('practice-photos');
    container.innerHTML = photos.map((p,i) =>
        '<div class="relative shrink-0">'+
            '<img src="'+p+'" class="w-20 h-20 rounded-xl object-cover" onclick="viewPhoto(\''+i+'\')">'+
            '<button onclick="removePhoto('+i+')" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-red-500 text-white text-xs flex items-center justify-center">✕</button>'+
        '</div>'
    ).join('');
}

function viewPhoto(index) {
    const photos = get(S.photos) || [];
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer';
    overlay.innerHTML = '<img src="'+photos[index]+'" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px">';
    overlay.addEventListener('click',()=>overlay.remove());
    document.body.appendChild(overlay);
}

// ===== Records =====
function renderRecords() {
    const sessions = get(S.sessions) || [];
    const filter = document.getElementById('record-filter')?.value || 'all';
    
    let filtered = [...sessions].reverse();
    const now = new Date();
    
    if(filter === 'week') {
        const weekStart = new Date(now); weekStart.setDate(now.getDate()-now.getDay());
        filtered = filtered.filter(s => new Date(s.date) >= weekStart);
    } else if(filter === 'month') {
        filtered = filtered.filter(s => s.date.startsWith(now.toISOString().slice(0,7)));
    }
    
    const container = document.getElementById('records-list');
    if(filtered.length === 0) {
        container.innerHTML = '<p class="text-sm text-gray-400 text-center py-8">暂无练习记录</p>';
        return;
    }
    
    // Group by date
    const grouped = {};
    filtered.forEach(s => {
        if(!grouped[s.date]) grouped[s.date] = [];
        grouped[s.date].push(s);
    });
    
    container.innerHTML = Object.entries(grouped).map(([date, recs]) => {
        const d = new Date(date);
        const total = recs.reduce((sum,r)=>sum+r.minutes,0);
        const label = d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric',weekday:'short'});
        return '<div class="mb-3">'+
            '<div class="flex justify-between items-center mb-2 px-1">'+
                '<span class="text-sm font-bold text-gray-700">📅 '+label+'</span>'+
                '<span class="text-xs text-purple-500 font-medium">共 '+total+' 分钟</span>'+
            '</div>'+
            recs.map(r => {
                let photoHtml = '';
                if(r.photos && r.photos.length>0) {
                    photoHtml = '<div class="flex gap-1 mt-2 overflow-x-auto">'+r.photos.map((p,i)=>'<img src="'+p+'" class="w-16 h-16 rounded-lg object-cover shrink-0" onclick="viewSessionPhoto(\''+date+'\','+i+')">').join('')+'</div>';
                }
                return '<div class="bg-white rounded-xl p-3 border border-purple-50 shadow-sm mb-1.5">'+
                    '<div class="flex justify-between items-start">'+
                        '<div>'+
                            '<span class="font-medium text-gray-800 text-sm">⏱ '+r.minutes+'分钟</span>'+
                            '<span class="text-xs text-gray-400 ml-2">'+r.time+'</span>'+
                        '</div>'+
                    '</div>'+
                    (r.pieces && r.pieces.length>0 ? '<div class="flex flex-wrap gap-1 mt-1">'+r.pieces.map(p=>'<span class="text-xs bg-purple-50 text-purple-600 px-2 py-0.5 rounded-full">🎵 '+p+'</span>').join('')+'</div>' : '')+
                    photoHtml+
                '</div>';
            }).join('')+
        '</div>';
    }).join('');
}

function viewSessionPhoto(date, index) {
    const sessions = get(S.sessions) || [];
    const session = sessions.find(s => s.date === date);
    if(!session || !session.photos) return;
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer';
    overlay.innerHTML = '<img src="'+session.photos[index]+'" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px">';
    overlay.addEventListener('click',()=>overlay.remove());
    document.body.appendChild(overlay);
}

// ===== Stats =====
function renderStats() {
    const sessions = get(S.sessions) || [];
    const now = new Date();
    
    // Total
    const totalMin = sessions.reduce((s,r)=>s+r.minutes,0);
    document.getElementById('stat-total-min').textContent = totalMin;
    
    // Days
    const days = new Set(sessions.map(s=>s.date)).size;
    document.getElementById('stat-total-days').textContent = days;
    
    // Best streak
    let bestStreak = 0, currentStreak = 0;
    const sortedDates = [...new Set(sessions.map(s=>s.date))].sort();
    for(let i=0; i<sortedDates.length; i++) {
        if(i===0) { currentStreak=1; continue; }
        const prev = new Date(sortedDates[i-1]);
        const curr = new Date(sortedDates[i]);
        const diff = (curr-prev)/(1000*60*60*24);
        if(diff === 1) currentStreak++;
        else { bestStreak = Math.max(bestStreak, currentStreak); currentStreak = 1; }
    }
    bestStreak = Math.max(bestStreak, currentStreak);
    document.getElementById('stat-best-streak').textContent = bestStreak;
    
    // Avg
    const avg = days > 0 ? Math.round(totalMin/days) : 0;
    document.getElementById('stat-avg-min').textContent = avg;
    
    // Week chart
    const weekDays = ['日','一','二','三','四','五','六'];
    const today = now.getDay();
    const weekData = [];
    for(let i=6; i>=0; i--) {
        const d = new Date(now);
        d.setDate(now.getDate()-i);
        const ds = d.toISOString().split('T')[0];
        const min = sessions.filter(s=>s.date===ds).reduce((s,r)=>s+r.minutes,0);
        weekData.push({label: weekDays[d.getDay()], min, isToday: i===0});
    }
    
    const maxMin = Math.max(...weekData.map(d=>d.min), 1);
    const chartEl = document.getElementById('week-chart');
    chartEl.innerHTML = weekData.map(d => {
        const h = Math.max(4, (d.min/maxMin)*100);
        return '<div class="flex-1 flex flex-col items-center gap-1">'+
            '<span class="text-xs '+(d.isToday?'text-purple-600 font-bold':'text-gray-400')+'">'+d.min+'</span>'+
            '<div class="w-full rounded-t-lg '+(d.isToday?'bg-purple-500':'bg-purple-200')+'" style="height:'+h+'px"></div>'+
        '</div>';
    }).join('');
    
    const labelsEl = document.getElementById('week-labels');
    labelsEl.innerHTML = weekData.map(d => 
        '<span class="text-xs '+(d.isToday?'text-purple-600 font-bold':'text-gray-400')+'">'+d.label+'</span>'
    ).join('');
}

function copyShareLinkV2() {
    if(!shareLinkV2) return;
    const ta = document.createElement('textarea');
    ta.value = shareLinkV2;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    alert('✅ 链接已复制！\n\n打开微信 → 粘贴发送给老师');
}

function shareToWechatV2() {
    if(!shareLinkV2) return;
    if(navigator.share) {
        navigator.share({title:'钢琴练习打卡',text:'钢琴练习报告 👉 '+shareLinkV2}).catch(()=>copyShareLinkV2());
    } else {
        copyShareLinkV2();
    }

// ===== Tab Switching =====
function switchTab(id) {
    document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
    const pageEl = document.getElementById('page-'+id);
    if(pageEl) pageEl.classList.add('active');
    document.querySelectorAll('.tab-item-v2').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.tab-item-v2[data-page="'+id+'"]').forEach(el=>el.classList.add('active'));
    if(id==='records') renderRecords();
    if(id==='stats') renderStats();
    document.getElementById('main-content').scrollTop = 0;
}

document.querySelectorAll('.tab-item-v2').forEach(btn=>{
    btn.addEventListener('click',()=>switchTab(btn.dataset.page));
});

// ===== Update all =====
function updateAll() {
    const sessions = get(S.sessions) || [];
    const todayStr = new Date().toISOString().split('T')[0];
    const todayMin = sessions.filter(s=>s.date===todayStr).reduce((s,r)=>s+r.minutes,0);
    document.getElementById('today-total').textContent = todayMin;
    
    // Streak
    let streak = get(S.streak)||0;
    const lastDate = get(S.lastDate);
    const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
    const yStr = yesterday.toISOString().split('T')[0];
    if(todayMin>0) {
        if(lastDate===yStr) streak++;
        else if(lastDate!==todayStr) streak=1;
        set(S.lastDate, todayStr);
        set(S.streak, streak);
    } else if(lastDate!==yStr && lastDate!==todayStr) {
        streak=0; set(S.streak,0);
    }
    document.getElementById('streak-count').textContent = streak;
    
    renderPieces();
    renderPhotos();
}

// ===== Init =====
if(!checkTeacherReport()) {
    const now = new Date();
    document.getElementById('weekday-display').textContent = now.toLocaleDateString('zh-CN',{weekday:'long'});
    document.getElementById('date-display').textContent = now.toLocaleDateString('zh-CN',{month:'long',day:'numeric'});
    
    // Reset undone pieces
    const pieces = get(S.pieces) || [];
    const todayStr = now.toISOString().split('T')[0];
    const lastPieceDate = localStorage.getItem('pp_piece_date');
    if(lastPieceDate !== todayStr) {
        pieces.forEach(p => p.done = false);
        set(S.pieces, pieces);
        localStorage.setItem('pp_piece_date', todayStr);
    }
    
    updateAll();
}
