<html lang="zh-CN">

    <style>
        :root{--safe:env(safe-area-inset-bottom,16px)}
        *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overscroll-behavior:none;background:#f1f5f9}
        .tab-bar{padding-bottom:var(--safe)}
        .tab-item{color:#94a3b8;transition:all .2s}
        .tab-item.active{color:#1e3a5f}
        .page{display:none}.page.active{display:block}
        .video-card{transition:all .15s}.video-card:active{transform:scale(.97)}

<body class="min-h-screen flex flex-col">

<header class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shrink-0 sticky top-0 z-10">
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white text-sm font-bold" style="background:#1e3a5f">造</div>
        <div><h1 class="text-base font-bold text-gray-800">一级造价师备考</h1><p class="text-xs text-gray-400" id="today-date"></p></div>
    </div>
    <div class="text-center">
        <p class="text-xs text-gray-400">距考试</p>
        <p class="text-lg font-bold" style="color:#dc2626" id="countdown">--天</p>
    </div>
</header>

<main class="flex-1 overflow-y-auto pb-20" id="main-content">

<!-- ====== 打卡 ====== -->
<div id="page-checkin" class="page active p-4">
    <div class="grid grid-cols-2 gap-3 mb-4">
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
            <div class="flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full" style="background:#3b82f6"></span><span class="text-xs text-gray-500">计价</span></div>
            <p class="text-xl font-bold text-gray-800"><span id="jj-count">0</span>/61</p>
            <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2"><div id="jj-bar" class="h-1.5 rounded-full transition-all" style="background:#3b82f6;width:0%"></div></div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
            <div class="flex items-center gap-2 mb-1"><span class="w-2 h-2 rounded-full" style="background:#f59e0b"></span><span class="text-xs text-gray-500">计量</span></div>
            <p class="text-xl font-bold text-gray-800"><span id="jl-count">0</span>/59</p>
            <div class="w-full bg-gray-100 h-1.5 rounded-full mt-2"><div id="jl-bar" class="h-1.5 rounded-full transition-all" style="background:#f59e0b;width:0%"></div></div>
        </div>
    </div>

    <div class="bg-blue-50 rounded-xl p-3 mb-3">
        <p class="text-xs text-blue-700" id="phase-info">💡 点击下方视频打卡，多听多打、提前补卡都行</p>
    </div>

    <div id="reward-section" class="hidden mb-3">
        <div class="rounded-2xl p-5 text-center text-white reward-pop" style="background:linear-gradient(135deg,#1e3a5f,#3b82f6)">
            <p class="text-3xl mb-2">🎉</p>
            <p class="text-base font-bold mb-1" id="reward-title">打卡达成！</p>
            <p class="text-sm opacity-80" id="reward-text"></p>
        </div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-3">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-gray-800 text-sm">🔵 计价（61集）</h3>
            <span class="text-xs text-gray-400" id="jj-summary">0/61</span>
        </div>
        <div id="jj-list" class="space-y-1.5"></div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-3">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-gray-800 text-sm">🟠 计量（59集）</h3>
            <span class="text-xs text-gray-400" id="jl-summary">0/59</span>
        </div>
        <div id="jl-list" class="space-y-1.5"></div>
    </div>

    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm">
        <h3 class="font-bold text-gray-800 text-sm mb-3">📝 额外打卡</h3>
        <div class="space-y-2" id="extra-tasks"></div>
    </div>
</div>

<!-- ====== 日历 ====== -->
<div id="page-calendar" class="page p-4">
    <h2 class="text-lg font-bold text-gray-800 mb-4">📅 学习日历</h2>
    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-3">
        <h3 class="font-bold text-gray-700 text-sm mb-3">7/30-8/20 · 视频首刷</h3>
        <div id="cal-phase1" class="grid grid-cols-7 gap-1"></div>
        <div class="mt-3 flex items-center gap-4 text-xs text-gray-400 flex-wrap">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#dbeafe"></span> 未开始</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#bfdbfe"></span> 部分完成</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#3b82f6"></span> 全部完成</span>
        </div>
    </div>
    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-3">
        <h3 class="font-bold text-gray-700 text-sm mb-3">8/21-8/31 · 重点复习</h3>
        <div id="cal-phase2" class="grid grid-cols-7 gap-1"></div>
        <div class="mt-3 flex items-center gap-4 text-xs text-gray-400 flex-wrap">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#fef3c7"></span> 未复习</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#fbbf24"></span> 已复习</span>
        </div>
    </div>
    <div class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm mb-3">
        <h3 class="font-bold text-gray-700 text-sm mb-3">9月 · 刷题阶段</h3>
        <div id="cal-phase3" class="grid grid-cols-7 gap-1"></div>
        <div class="mt-3 flex items-center gap-4 text-xs text-gray-400 flex-wrap">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#f3e8ff"></span> 未打卡</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded" style="background:#8b5cf6"></span> 已打卡</span>
        </div>
    </div>
    <div class="bg-blue-50 rounded-xl p-3">
        <p class="text-xs text-blue-700">💡 <b>学习计划</b><br>• 7/30-8/20（22天）：首刷120集视频<br>• 8/21-8/31（11天）：反复复习，找重点<br>• 9月起：正式刷真题+整理错题<br>• 10月17日考试</p>
    </div>
</div>

</main>

<nav class="tab-bar bg-white border-t border-gray-100 fixed bottom-0 left-0 right-0 z-20">
    <div class="flex justify-around items-center h-16 max-w-lg mx-auto">
        <button class="tab-item active flex flex-col items-center gap-0.5 px-6 py-1" data-page="checkin"><span class="text-xl">✅</span><span class="text-[10px] font-medium">打卡</span></button>
        <button class="tab-item flex flex-col items-center gap-0.5 px-6 py-1" data-page="calendar"><span class="text-xl">📅</span><span class="text-[10px] font-medium">日历</span></button>
    </div>
</nav>

<script>
const S={
    jijie:'zao_jijie_v2',      // 计价已打卡集数 [1,2,3...]
    jiliang:'zao_jiliang_v2',  // 计量已打卡集数
    extra:'zao_extra_v2',      // 额外打卡
    reviewDays:'zao_review_v2',// 复习打卡日期
    sepPractice:'zao_sep_v2'   // 9月刷题打卡
};
function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const today=new Date();
today.setHours(0,0,0,0);
const examDate=new Date('2026-10-17');
examDate.setHours(0,0,0,0);
const diff=Math.ceil((examDate-today)/(1000*60*60*24));
document.getElementById('today-date').textContent=today.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
document.getElementById('countdown').textContent=diff+'天';

const TOTAL_JJ=61, TOTAL_JL=59;
const START_DATE=new Date(2026,6,30); START_DATE.setHours(0,0,0,0);
const REVIEW_START=new Date(2026,7,21); REVIEW_START.setHours(0,0,0,0);
const PRACTICE_START=new Date(2026,8,1); PRACTICE_START.setHours(0,0,0,0);

const rewards=[
    '今天的努力，是考场上最坚实的底气！💪','每一集视频都在缩短你和证书的距离！📖',
    '坚持住，造价师不是梦，是计划中的确定！🎯','今天的视频，就是明天的考分！⭐',
    '别人在刷手机，你在刷视频，这就是差距！🔥','22天首刷，11天复习，9月刷题，10月拿证！📊',
    '每天进步一点点，120集终将被你拿下！🏆','你不是在备考，你是在给自己的未来加码！💎',
    '今天的自律，是明天考场上的自信！✨','计价计量双管齐下，证书就在前方！🚀'
];

function getPhase(){
    if(today<START_DATE) return 'prep';
    if(today<REVIEW_START) return 'firstPass';
    if(today<PRACTICE_START) return 'review';
    return 'practice';
}

// ====== 打卡页 ======
function renderCheckin(){
    const jjDone=get(S.jijie)||[];
    const jlDone=get(S.jiliang)||[];
    const phase=getPhase();
    
    // 阶段提示
    let phaseText='';
    if(phase==='prep') phaseText='💡 7月30日正式开始，可提前打卡';
    else if(phase==='firstPass'){
        const dayDiff=Math.floor((today-START_DATE)/(1000*60*60*24))+1;
        phaseText='💡 首刷阶段 第'+dayDiff+'天/22天 · 建议每天5~6集，多点少点都行';
    }
    else if(phase==='review'){
        const dayDiff=Math.floor((today-REVIEW_START)/(1000*60*60*24))+1;
        phaseText='💡 复习阶段 第'+dayDiff+'天/11天 · 反复看，找重点';
    }
    else{
        const dayDiff=Math.floor((today-PRACTICE_START)/(1000*60*60*24))+1;
        phaseText='💡 刷题阶段 第'+dayDiff+'天 · 刷真题+整理错题';
    }
    document.getElementById('phase-info').textContent=phaseText;
    
    // 进度
    document.getElementById('jj-count').textContent=jjDone.length;
    document.getElementById('jl-count').textContent=jlDone.length;
    document.getElementById('jj-summary').textContent=jjDone.length+'/61';
    document.getElementById('jl-summary').textContent=jlDone.length+'/59';
    document.getElementById('jj-bar').style.width=Math.round(jjDone.length/61*100)+'%';
    document.getElementById('jl-bar').style.width=Math.round(jlDone.length/59*100)+'%';
    
    // 计价列表
    let jjHtml='';
    for(let i=1;i<=TOTAL_JJ;i++){
        const done=jjDone.includes(i);
        jjHtml+='<div class="video-card flex items-center gap-3 p-2.5 rounded-xl border '+(done?'border-blue-300 bg-blue-50':'border-gray-100')+'" onclick="toggleVideo(\'jijie\','+i+')">'+
            '<div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 '+(done?'bg-blue-500 border-blue-500':'border-gray-300')+'">'+(done?'<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>':'')+'</div>'+
            '<span class="text-xs text-gray-400 w-7">#'+i+'</span>'+
            '<span class="text-sm '+(done?'text-blue-700 line-through':'text-gray-700')+'">第'+i+'集</span>'+
        '</div>';
    }
    document.getElementById('jj-list').innerHTML=jjHtml;
    
    // 计量列表
    let jlHtml='';
    for(let i=1;i<=TOTAL_JL;i++){
        const done=jlDone.includes(i);
        jlHtml+='<div class="video-card flex items-center gap-3 p-2.5 rounded-xl border '+(done?'border-orange-300 bg-orange-50':'border-gray-100')+'" onclick="toggleVideo(\'jiliang\','+i+')">'+
            '<div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 '+(done?'bg-orange-500 border-orange-500':'border-gray-300')+'">'+(done?'<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>':'')+'</div>'+
            '<span class="text-xs text-gray-400 w-7">#'+i+'</span>'+
            '<span class="text-sm '+(done?'text-orange-700 line-through':'text-gray-700')+'">第'+i+'集</span>'+
        '</div>';
    }
    document.getElementById('jl-list').innerHTML=jlHtml;
    
    renderExtra();
    checkReward();
}

function toggleVideo(type,n){
    const key=type==='jijie'?S.jijie:S.jiliang;
    const done=get(key)||[];
    const idx=done.indexOf(n);
    if(idx>=0) done.splice(idx,1);  // 取消
    else done.push(n);               // 打卡
    set(key,done);
    renderCheckin();
    renderCalendar();
}

// ====== 额外打卡 ======
function renderExtra(){
    const extra=get(S.extra)||{};
    let tasks=[
        {id:'read',label:'看教材/讲义 30分钟',icon:'📖'},
        {id:'note',label:'整理笔记',icon:'✏️'},
        {id:'review',label:'复习昨天内容',icon:'🔄'}
    ];
    // 刷题阶段额外项
    if(getPhase()==='practice'){
        tasks=[
            {id:'practice1',label:'刷真题 1套',icon:'📝'},
            {id:'practice2',label:'整理错题本（5题）',icon:'📕'},
            {id:'practice3',label:'复习薄弱章节',icon:'🔍'}
        ];
    }
    const container=document.getElementById('extra-tasks');
    container.innerHTML=tasks.map(t=>{
        const done=extra[t.id];
        return '<div class="video-card flex items-center gap-3 p-3 rounded-xl border '+(done?'border-green-300 bg-green-50':'border-gray-100')+'" onclick="toggleExtra(\''+t.id+'\')">'+
            '<div class="w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 '+(done?'bg-green-500 border-green-500':'border-gray-300')+'">'+(done?'<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>':'')+'</div>'+
            '<span class="text-lg">'+t.icon+'</span>'+
            '<span class="text-sm '+(done?'text-green-700 line-through':'text-gray-700')+'">'+t.label+'</span>'+
        '</div>';
    }).join('');
}

function toggleExtra(id){
    const extra=get(S.extra)||{};
    extra[id]=!extra[id];
    set(S.extra,extra);
    renderExtra();
    checkReward();
}

function checkReward(){
    const jjDone=get(S.jijie)||[];
    const jlDone=get(S.jiliang)||[];
    const extra=get(S.extra)||{};
    
    // 首刷/复习阶段：当天至少打卡5集 + 额外任务全完成
    const phase=getPhase();
    let rewarded=false;
    if(phase==='firstPass'||phase==='review'){
        const totalDone=jjDone.length+jlDone.length;
        if(totalDone>=5 && extra.read && extra.note && extra.review){
            rewarded=true;
        }
    }
    if(phase==='practice'){
        if(extra.practice1&&extra.practice2&&extra.practice3) rewarded=true;
    }
    
    const section=document.getElementById('reward-section');
    if(rewarded){
        section.classList.remove('hidden');
        document.getElementById('reward-text').textContent=rewards[Math.floor(Math.random()*rewards.length)];
    }else{
        section.classList.add('hidden');
    }
}

// ====== 日历 ======
function renderCalendar(){
    const jjDone=get(S.jijie)||[];
    const jlDone=get(S.jiliang)||[];
    const reviewDays=get(S.reviewDays)||[];
    const sepPractice=get(S.sepPractice)||{};
    const weekDays=['一','二','三','四','五','六','日'];
    
    // === 首刷阶段 7/30-8/20 ===
    let html='';
    weekDays.forEach(d=>{html+='<div class="text-center text-xs text-gray-300 pb-2">'+d+'</div>'});
    const startOffset=(START_DATE.getDay()+6)%7;
    for(let i=0;i<startOffset;i++) html+='<div></div>';
    
    const firstPassDays=22;
    for(let d=0;d<firstPassDays;d++){
        const dateObj=new Date(START_DATE);
        dateObj.setDate(dateObj.getDate()+d);
        const isFuture=dateObj>today;
        const isToday=dateObj.toISOString().split('T')[0]===today.toISOString().split('T')[0];
        const dayNum=dateObj.getDate();
        const dateStr=dateObj.toISOString().split('T')[0];
        
        // 当天预期视频
        const dayIndex=d;
        const jjExpected=[], jlExpected=[];
        for(let i=0;i<3;i++) if(dayIndex*3+i+1<=TOTAL_JJ) jjExpected.push(dayIndex*3+i+1);
        for(let i=0;i<3;i++) if(dayIndex*3+i+1<=TOTAL_JL) jlExpected.push(dayIndex*3+i+1);
        
        let bg,textColor;
        if(isFuture){
            bg='#f8fafc'; textColor='#64748b';
        }else{
            const jjComplete=jjExpected.length>0&&jjExpected.every(n=>jjDone.includes(n));
            const jlComplete=jlExpected.length>0&&jlExpected.every(n=>jlDone.includes(n));
            const jjPartial=jjExpected.some(n=>jjDone.includes(n));
            const jlPartial=jlExpected.some(n=>jlDone.includes(n));
            if(jjComplete&&jlComplete){bg='#3b82f6';textColor='#fff';}
            else if(jjPartial||jlPartial){bg='#bfdbfe';textColor='#1e40af';}
            else{bg='#f1f5f9';textColor='#64748b';}
        }
        const todayRing=isToday?'box-shadow:0 0 0 2px #dc2626;':'';
        html+='<div class="text-center rounded-lg py-2 text-xs cursor-pointer" style="background:'+bg+';color:'+textColor+';font-weight:'+(isToday?'700':'400')+';'+todayRing+'" onclick="showDayDetail(\'firstPass\','+d+',\''+dateStr+'\')">'+dayNum+'</div>';
    }
    document.getElementById('cal-phase1').innerHTML=html;
    
    // === 复习阶段 8/21-8/31 ===
    html='';
    weekDays.forEach(d=>{html+='<div class="text-center text-xs text-gray-300 pb-2">'+d+'</div>'});
    const reviewOffset=(REVIEW_START.getDay()+6)%7;
    for(let i=0;i<reviewOffset;i++) html+='<div></div>';
    const reviewDays_total=11;
    for(let d=0;d<reviewDays_total;d++){
        const dateObj=new Date(REVIEW_START);
        dateObj.setDate(dateObj.getDate()+d);
        const isFuture=dateObj>today;
        const isToday=dateObj.toISOString().split('T')[0]===today.toISOString().split('T')[0];
        const dateStr=dateObj.toISOString().split('T')[0];
        const done=reviewDays.includes(dateStr);
        let bg,textColor;
        if(isFuture){bg='#f8fafc';textColor='#64748b';}
        else if(done){bg='#fbbf24';textColor='#fff';}
        else{bg='#fef3c7';textColor='#92400e';}
        const todayRing=isToday?'box-shadow:0 0 0 2px #dc2626;':'';
        html+='<div class="text-center rounded-lg py-2 text-xs cursor-pointer" style="background:'+bg+';color:'+textColor+';font-weight:'+(isToday?'700':'400')+';'+todayRing+'" onclick="showDayDetail(\'review\','+d+',\''+dateStr+'\')">'+dateObj.getDate()+'</div>';
    }
    document.getElementById('cal-phase2').innerHTML=html;
    
    // === 9月刷题 ===
    html='';
    weekDays.forEach(d=>{html+='<div class="text-center text-xs text-gray-300 pb-2">'+d+'</div>'});
    const practiceOffset=(PRACTICE_START.getDay()+6)%7;
    for(let i=0;i<practiceOffset;i++) html+='<div></div>';
    for(let d=1;d<=30;d++){
        const dateObj=new Date(2026,8,d);
        const isFuture=dateObj>today;
        const isToday=dateObj.toISOString().split('T')[0]===today.toISOString().split('T')[0];
        const dateKey='2026-9-'+d;
        const done=sepPractice[dateKey];
        let bg,textColor;
        if(isFuture){bg='#f8fafc';textColor='#64748b';}
        else if(done){bg='#8b5cf6';textColor='#fff';}
        else{bg='#f3e8ff';textColor='#7c3aed';}
        const todayRing=isToday?'box-shadow:0 0 0 2px #dc2626;':'';
        html+='<div class="text-center rounded-lg py-2 text-xs cursor-pointer" style="background:'+bg+';color:'+textColor+';font-weight:'+(isToday?'700':'400')+';'+todayRing+'" onclick="showDayDetail(\'practice\','+d+',\''+dateKey+'\')">'+d+'</div>';
    }
    document.getElementById('cal-phase3').innerHTML=html;
}

function showDayDetail(type,dayIndex,dateStr){
    const dateObj=new Date(dateStr+'T00:00:00');
    const dateLabel=dateObj.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
    let content='';
    
    if(type==='firstPass'){
        const jjDone=get(S.jijie)||[];
        const jlDone=get(S.jiliang)||[];
        const dayIdx=dayIndex;
        const jjExpected=[], jlExpected=[];
        for(let i=0;i<3;i++) if(dayIdx*3+i+1<=TOTAL_JJ) jjExpected.push(dayIdx*3+i+1);
        for(let i=0;i<3;i++) if(dayIdx*3+i+1<=TOTAL_JL) jlExpected.push(dayIdx*3+i+1);
        const jjD=jjExpected.filter(n=>jjDone.includes(n));
        const jjU=jjExpected.filter(n=>!jjDone.includes(n));
        const jlD=jlExpected.filter(n=>jlDone.includes(n));
        const jlU=jlExpected.filter(n=>!jlDone.includes(n));
        content+='<p class="text-xs text-gray-500 mb-2">📺 计划：计价'+jjExpected.length+'集 + 计量'+jlExpected.length+'集</p>';
        if(jjD.length>0) content+='<p class="text-sm mb-1 text-blue-600">🔵 计价已完成：第'+jjD.join('、')+'集</p>';
        if(jjU.length>0) content+='<p class="text-sm mb-1 text-gray-400">⚪ 计价未完成：第'+jjU.join('、')+'集</p>';
        if(jlD.length>0) content+='<p class="text-sm mb-1 text-orange-600">🟠 计量已完成：第'+jlD.join('、')+'集</p>';
        if(jlU.length>0) content+='<p class="text-sm mb-1 text-gray-400">⚪ 计量未完成：第'+jlU.join('、')+'集</p>';
        if(jjU.length===0&&jlU.length===0&&jjExpected.length>0) content+='<p class="text-sm text-green-600 font-medium">✅ 当天任务全部完成！</p>';
    }
    
    if(type==='review'){
        const reviewDays=get(S.reviewDays)||[];
        const done=reviewDays.includes(dateStr);
        content+='<p class="text-xs text-gray-500 mb-2">🔁 复习阶段</p>';
        content+=done?'<p class="text-sm text-yellow-600 font-medium">✅ 当天已复习打卡</p>':'<p class="text-sm text-gray-400">❌ 当天未复习打卡</p>';
    }
    
    if(type==='practice'){
        const sepPractice=get(S.sepPractice)||{};
        const done=sepPractice[dateStr];
        content+='<p class="text-xs text-gray-500 mb-2">✏️ 刷题阶段</p>';
        content+=done?'<p class="text-sm text-purple-600 font-medium">✅ 当天已完成刷题</p>':'<p class="text-sm text-gray-400">❌ 当天未打卡</p>';
    }
    
    showModal(dateLabel,content);
}

function showModal(title,content){
    const old=document.getElementById('day-detail-modal');
    if(old) old.remove();
    const modal=document.createElement('div');
    modal.id='day-detail-modal';
    modal.className='fixed inset-0 z-50 flex items-center justify-center p-4';
    modal.style.background='rgba(0,0,0,0.4)';
    modal.innerHTML='<div class="bg-white rounded-2xl p-5 w-full max-w-sm shadow-xl" onclick="event.stopPropagation()">'+
        '<div class="flex items-center justify-between mb-3">'+
            '<h3 class="font-bold text-gray-800">'+title+'</h3>'+
            '<button onclick="document.getElementById(\'day-detail-modal\').remove()" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-400">✕</button>'+
        '</div>'+
        '<div>'+content+'</div>'+
    '</div>';
    modal.addEventListener('click',()=>modal.remove());
    document.body.appendChild(modal);
}

// ====== Tab 切换 ======
document.querySelectorAll('.tab-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
        const page=btn.dataset.page;
        document.querySelectorAll('.tab-item').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById('page-'+page).classList.add('active');
        if(page==='calendar') renderCalendar();
    });
});

// ====== 初始化 ======
function init(){
    renderCheckin();
    renderCalendar();
}
init();
</script>
